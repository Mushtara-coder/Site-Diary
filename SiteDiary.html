    /* ══════════════════════════════════════════════════════
       SETTINGS PAGE
    ══════════════════════════════════════════════════════ */
    function SettingsPage({ user, setUser, onNav, showToast, toggleTheme, effectiveTheme }) {
      const [tab, setTab] = useState("profile");
      const [profile, setProfile] = useState({ firstName:user?.firstName||"", lastName:user?.lastName||"", email:user?.email||"", org:user?.org||"" });

      function saveProfile() {
        if (!profile.firstName || !profile.email) { showToast("Name and email required","error"); return; }
        const users = LS.get(KEYS.users,[]).map(u => u.id===user?.id ? { ...u, ...profile } : u);
        LS.set(KEYS.users, users);
        const updated = { ...user, ...profile };
        LS.set(KEYS.session, updated);
        setUser(updated);
        showToast("Profile saved","success");
      }

      const tabs = [
        { id:"profile",  label:"Profile" },
        { id:"security", label:"Security" },
        { id:"app",      label:"App Settings" },
      ];

      return (
        <AppLayout page="settings" onNav={onNav} user={user} onLogout={() => { LS.del(KEYS.session); onNav("landing"); }} toggleTheme={toggleTheme} effectiveTheme={effectiveTheme}>
          {(setMob, toggleTheme, effectiveTheme) => (
            <>
              <Topbar breadcrumb="Settings" onHamburger={() => setMob(o=>!o)} toggleTheme={toggleTheme} effectiveTheme={effectiveTheme} />
              <Content>
                <PageTitle eyebrow="Preferences" title="SETTINGS" />
                <div className="sd-settings-layout" style={{ display:"grid", gridTemplateColumns:"200px 1fr", gap:24, alignItems:"start" }}>
                  <div className="sd-settings-tabs" style={{ display:"flex", flexDirection:"column", gap:2 }}>
                    {tabs.map(t => (
                      <div key={t.id} onClick={() => setTab(t.id)} style={{ padding:"11px 14px", color:tab===t.id?T.amber:T.muted, fontSize:13.5, cursor:"pointer", borderRadius:3, transition:"all 0.15s", border:`1px solid ${tab===t.id?"rgba(245,158,11,0.15)":"transparent"}`, background:tab===t.id?T.amberGlow:"none" }}>
                        {t.label}
                      </div>
                    ))}
                  </div>

                  <div>
                    {tab === "profile" && (
                      <PanelCard>
                        <PanelHeader title="PROFILE" badge="PERSONAL INFO" />
                        <div style={{ display:"flex", alignItems:"center", gap:20, marginBottom:28, paddingBottom:24, borderBottom:`1px solid ${T.border}` }}>
                          <div style={{ width:64, height:64, background:T.amber, borderRadius:"50%", display:"grid", placeItems:"center", fontFamily:"'Bebas Neue',sans-serif", fontSize:28, color:T.black, flexShrink:0 }}>
                            {(user?.firstName?.[0]||"") + (user?.lastName?.[0]||"")}
                          </div>
                          <div>
                            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:11, letterSpacing:"0.5px", color:T.muted, marginTop:6 }}>Avatar uses your initials</div>
                          </div>
                        </div>
                        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
                          <FormGroup label="First Name"><Input value={profile.firstName} onChange={e=>setProfile(p=>({...p,firstName:e.target.value}))} /></FormGroup>
                          <FormGroup label="Last Name"> <Input value={profile.lastName}  onChange={e=>setProfile(p=>({...p,lastName:e.target.value}))} /></FormGroup>
                        </div>
                        <FormGroup label="Email"><Input type="email" value={profile.email} onChange={e=>setProfile(p=>({...p,email:e.target.value}))} /></FormGroup>
                        <FormGroup label="Organisation"><Input value={profile.org} onChange={e=>setProfile(p=>({...p,org:e.target.value}))} /></FormGroup>
                        <FormGroup label="Role">
                          <div style={{ fontFamily:"'DM Mono',monospace", fontSize:12, color:T.amber, padding:"10px 0" }}>{user?.role?.toUpperCase() || "—"}</div>
                        </FormGroup>
                        <button onClick={saveProfile} style={{ background:T.amber, border:"none", color:T.black, padding:"13px 28px", fontFamily:"'DM Sans',sans-serif", fontWeight:700, fontSize:14, cursor:"pointer", clipPath:"polygon(0 0, 92% 0, 100% 16%, 100% 100%, 8% 100%, 0 84%)" }}>SAVE PROFILE</button>
                      </PanelCard>
                    )}

                    {tab === "security" && (
                      <PanelCard>
                        <PanelHeader title="SECURITY" badge="ACCOUNT" />
                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"16px 0", borderBottom:`1px solid ${T.border}` }}>
                          <div>
                            <div style={{ fontSize:14, fontWeight:500 }}>Session Management</div>
                            <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>Sessions expire after 8 hours or 30 min of inactivity</div>
                          </div>
                        </div>
                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"16px 0", borderBottom:`1px solid ${T.border}` }}>
                          <div>
                            <div style={{ fontSize:14, fontWeight:500 }}>Password Hashing</div>
                            <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>Passwords protected with PBKDF2-SHA256</div>
                          </div>
                          <span style={{ background:"rgba(34,197,94,0.1)", color:T.green, padding:"4px 10px", fontFamily:"'DM Mono',monospace", fontSize:10, letterSpacing:1 }}>ENABLED</span>
                        </div>
                        <div style={{ padding:"16px 0" }}>
                          <div style={{ fontSize:14, fontWeight:500, marginBottom:4 }}>Signed in as</div>
                          <div style={{ fontFamily:"'DM Mono',monospace", fontSize:12, color:T.amber }}>{user?.email}</div>
                        </div>
                        <button onClick={() => { LS.del(KEYS.session); onNav("login"); }} style={{ background:"transparent", border:`1px solid rgba(239,68,68,0.4)`, color:T.red, padding:"9px 18px", fontFamily:"'DM Sans',sans-serif", fontSize:13, cursor:"pointer" }}>SIGN OUT ALL SESSIONS</button>
                      </PanelCard>
                    )}

                    {tab === "app" && (
                      <PanelCard>
                        <PanelHeader title="APP SETTINGS" />
                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"16px 0", borderBottom:`1px solid ${T.border}` }}>
                          <div>
                            <div style={{ fontSize:14, fontWeight:500 }}>Dark Mode</div>
                            <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>Current: Dark theme (system default)</div>
                          </div>
                          <span style={{ background:T.amberGlow, color:T.amber, padding:"4px 10px", fontFamily:"'DM Mono',monospace", fontSize:10, letterSpacing:1 }}>DARK</span>
                        </div>
                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"16px 0", borderBottom:`1px solid ${T.border}` }}>
                          <div>
                            <div style={{ fontSize:14, fontWeight:500 }}>Data Storage</div>
                            <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>Using localStorage — connect Firebase for cloud sync</div>
                          </div>
                          <span style={{ background:T.panel2, color:T.muted, padding:"4px 10px", fontFamily:"'DM Mono',monospace", fontSize:10, letterSpacing:1 }}>LOCAL</span>
                        </div>
                        <div style={{ padding:"16px 0" }}>
                          <div style={{ fontSize:14, fontWeight:500, marginBottom:4 }}>Entries Stored</div>
                          <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:32, color:T.amber }}>{LS.get(KEYS.entries,[]).filter(e=>!e.userId||e.userId===user?.id).length}</div>
                        </div>
                        <div style={{ marginTop:8, padding:16, background:"rgba(139,92,246,0.06)", border:`1px solid rgba(139,92,246,0.2)` }}>
                          <div style={{ fontFamily:"'DM Mono',monospace", fontSize:11, letterSpacing:"1px", color:"#a78bfa", marginBottom:6 }}>FIREBASE CLOUD SYNC</div>
                          <div style={{ fontSize:13, color:T.muted }}>Connect a Firebase project to enable real-time cloud sync across your team. This is available in the full app.</div>
                        </div>
                      </PanelCard>
                    )}
                  </div>
                </div>
              </Content>
            </>
          )}
        </AppLayout>
      );
    }

    /* ══════════════════════════════════════════════════════
       ROOT APP
    ══════════════════════════════════════════════════════ */
    function App() {
      const [user, setUser] = useState(() => {
        try {
          const s = LS.get(KEYS.session);
          if (!s?.id) return null;
          const now = Date.now();
          if (s._loginAt && (now - s._loginAt) > 8*60*60*1000) { LS.del(KEYS.session); return null; }
          if (s._lastActive && (now - s._lastActive) > 30*60*1000) { LS.del(KEYS.session); return null; }
          return s;
        } catch { return null; }
      });

      const [page, setPage] = useState(() => {
        if (LS.get(KEYS.session)?.id) return "dashboard";
        return "landing";
      });

      const [toasts, setToasts] = useState([]);

      /* ── Theme: "dark" | "light" | null (follow system) ── */
      const [theme, setTheme] = useState(() => LS.get("sd_theme", null));

      useEffect(() => {
        const html = document.documentElement;
        if (theme === "light") { html.setAttribute("data-theme", "light"); }
        else if (theme === "dark") { html.setAttribute("data-theme", "dark"); }
        else { html.removeAttribute("data-theme"); }
        if (theme) LS.set("sd_theme", theme); else LS.del("sd_theme");
      }, [theme]);

      function toggleTheme() {
        setTheme(prev => {
          if (prev === null) {
            // detect current effective theme to toggle away from it
            const sys = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            return sys === "light" ? "dark" : "light";
          }
          return prev === "dark" ? "light" : "dark";
        });
      }

      /* derive current effective theme for the button label */
      const effectiveTheme = theme ?? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");

      useEffect(() => {
        const users = LS.get(KEYS.users,[]);
        const demoDefs = [
          { id:"demo",        firstName:"Ada",   lastName:"Okonkwo", email:"demo@sitediary.com",   password:"demo123", role:"admin",  org:"Acme Construction Ltd." },
          { id:"demo_viewer", firstName:"Kwame", lastName:"Asante",  email:"viewer@sitediary.com", password:"demo123", role:"viewer", org:"Acme Construction Ltd." },
        ];
        let changed = false;
        demoDefs.forEach(def => {
          if (!users.find(u=>u.email===def.email)) { users.push({...def}); changed=true; }
        });
        if (changed) LS.set(KEYS.users, users);
        (async () => {
          let upgraded=false;
          for (const u of users) {
            if (u.password && !u.password.startsWith("pbkdf2:")) { u.password=await hashPassword(u.password); upgraded=true; }
          }
          if (upgraded) LS.set(KEYS.users, users);
        })();
      }, []);

      function showToast(msg, type="info") {
        const id = uid();
        setToasts(t => [...t, { id, msg, type }]);
        setTimeout(() => setToasts(t => t.filter(x=>x.id!==id)), 4000);
      }
      function removeToast(id) { setToasts(t => t.filter(x=>x.id!==id)); }

      function navigate(target) {
        const APP_PAGES = ["dashboard","new-entry","projects","reports","settings"];
        if (APP_PAGES.includes(target) && !user) { setPage("login"); return; }
        if ((target==="login"||target==="signup") && user) { setPage("dashboard"); return; }
        setPage(target);
        window.scrollTo(0,0);
      }

      function handleLogin(sessionUser) {
        setUser(sessionUser);
        setPage("dashboard");
      }

      function handleLogout() {
        LS.del(KEYS.session);
        setUser(null);
        setPage("landing");
        showToast("Signed out","info");
      }

      const commonProps = { user, onNav: navigate, showToast, toggleTheme, effectiveTheme };

      return (
        <div style={{ minHeight:"100vh", background:T.black, color:T.white }}>
          {page==="landing"   && <LandingPage onNav={navigate} toggleTheme={toggleTheme} effectiveTheme={effectiveTheme} />}
          {page==="login"     && <LoginPage   onNav={navigate} onLogin={handleLogin} showToast={showToast} toggleTheme={toggleTheme} effectiveTheme={effectiveTheme} />}
          {page==="signup"    && <SignupPage  onNav={navigate} onLogin={handleLogin} showToast={showToast} toggleTheme={toggleTheme} effectiveTheme={effectiveTheme} />}
          {page==="dashboard" && <DashboardPage {...commonProps} />}
          {page==="new-entry" && <NewEntryPage  {...commonProps} />}
          {page==="projects"  && <ProjectsPage  {...commonProps} />}
          {page==="reports"   && <ReportsPage   {...commonProps} />}
          {page==="settings"  && <SettingsPage  {...commonProps} setUser={setUser} />}
          <ToastContainer toasts={toasts} remove={removeToast} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
